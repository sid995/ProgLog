# Request definition
[request_definition]
r = sub, obj, act

# Policy definition
[policy_definition]
p = sub, obj, act

# Policy effect
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# Object matching is exact: "*" is a literal shared log object, not pattern syntax.
[matchers]
m = r.sub == p.sub && r.obj == p.obj && r.act == p.act